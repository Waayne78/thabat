<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Thabāt — mémorise le Coran, et garde-le. Plan automatique, révisions espacées, maîtrise réelle." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Thabāt — Ce qui est ancré demeure</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("thabat-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
